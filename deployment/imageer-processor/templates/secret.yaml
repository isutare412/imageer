{{- if .Values.secretEnvs }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "imageer-processor.fullname" . }}-env
  labels:
    {{- include "imageer-processor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnvs }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
