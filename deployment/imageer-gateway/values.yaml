# Default values for imageer-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: redshoore/imageer-gateway
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: &port 8080

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  horizontal:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80 # 0 to disable
    targetMemoryUtilizationPercentage: 0 # 0 to disable
  vertical:
    enabled: false
    updatePolicy:
      updateMode: InPlaceOrRecreate
      minReplicas: 2
    resourcePolicy:
      containerPolicies:
        - containerName: '*'
          controlledResources:
            - memory
            # - cpu
          minAllowed:
            memory: 100Mi
            # cpu: 100m
          maxAllowed:
            memory: 1Gi
            # cpu: 1

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Environment variables for the container (list of EnvVar, valueFrom allowed).
envs: []

# Environment variables that hold credentials (map of name to value). They are
# rendered into the Secret <fullname>-env and loaded with envFrom, so they stay
# out of the Deployment spec. A name also listed in envs takes the envs value.
secretEnvs: {}

nodeSelector: {}

tolerations: []

affinity: {}

config:
  log:
    format: json # pretty, text, json
    level: info # debug, info, warn, error
    add-source: false
    component: imageer-gateway

  trace:
    enabled: false
    service-name: imageer-gateway
    sampling-ratio: 0.1
    otlp-grpc-endpoint: localhost:4317

  web:
    port: *port
    show-banner: false
    show-openapi-docs: false
    write-timeout: 60s
    read-timeout: 60s
    read-header-timeout: 10s
    cors:
      allow-origins: "*"
      allow-headers: Content-Type,Authorization
      allow-methods: GET,POST,PUT,DELETE,OPTIONS
      allow-credentials: false
      max-age: 3h

  kubernetes:
    enabled: true

    config:
      use-in-cluster: true
      kubeconfig:
        path: "" # "" means ~/.kube/config
        context: "" # "" means current-context

    leader-election:
      lease-name: imageer-gateway
      lease-namespace: imageer
      lease-duration: 15s
      renew-deadline: 10s
      retry-period: 2s

  database:
    use-in-memory: false
    trace-log: false
    postgres:
      host: localhost
      port: 5432
      user: user
      password: password
      database: database_name

  valkey:
    addresses: localhost:6379
    username: admin
    password: complex_password

    pubsub:
      image-upload-done:
        channel-prefix: "imageer:prod:image-upload-done:"
        max-retries: 3
      image-process-done:
        channel-prefix: "imageer:prod:image-process-done:"
        max-retries: 3

  kafka:
    addresses: localhost:9092
    username: admin
    password: complex_password
    consumer-group: imageer-gateway
    partitioner: uniform-bytes # "" (uniform-bytes) / uniform-bytes / round-robin

    topics:
      image-process-request:
        topic: imageer.image.process.request

      image-process-result:
        topic: imageer.image.process.result
        retry-topic: imageer.image.process.result.retry
        handler:
          timeout: 30s
          max-retry-attempt: 3
          retry-base-delay: 100ms

      image-s3-delete-request:
        topic: imageer.image.s3.delete.request
        retry-topic: imageer.image.s3.delete.request.retry
        handler:
          timeout: 30s
          max-retry-attempt: 3
          retry-base-delay: 100ms

  auth:
    cookies:
      oidc-state:
        name: IMAGEER_OIDC_STATE
        ttl: 5m
      user:
        name: IMAGEER_USER
        ttl: 720h
        refresh-threshold: 336h

    service-account:
      api-key-header: X-API-KEY

    jwt:
      # No default key pair: a key in this public chart would be trusted by every deployment.
      # Set active-key-pair-name and key-pairs.<name>.private/public per deployment, e.g.
      # through env GATEWAY__AUTH__JWT__KEY_PAIRS__<NAME>__PRIVATE from a Secret.
      key-pairs: {}

    google:
      client-id: <your-google-client-id>
      client-secret: <your-google-client-secret>
      callback-path: /api/v1/auth/google/sign-in/callback

  crypt:
    aes:
      key: <random-length-complex-string>

  aws:
    s3:
      bucket: imageer
      prefix:
        image: production/images
      presign:
        expiry: 10m

    cloudfront:
      images:
        distribution-domain: https://example.cloudfront.net

    sqs:
      image-upload-event-queue:
        queue-url: https://sqs.us-east-1.amazonaws.com/123456789012/queue-name
        batch-count: 10
        polling-wait-timeout: 20s
        visibility-timeout: 30s
        batch-handle-timeout: 25s
        handle-timeout: 20s

  service:
    image:
      process-done-wait-timeout: 30s
      expire-check-interval: 1m
