log:
  format: json # pretty, text, json
  level: info # debug, info, warn, error
  add-source: false
  component: imageer-gateway

trace:
  enabled: false
  service-name: imageer-gateway
  sampling-ratio: 0.1
  otlp-grpc-endpoint: localhost:4317

web:
  port: 8080
  show-banner: false
  show-openapi-docs: false
  write-timeout: 60s
  read-timeout: 60s
  read-header-timeout: 10s
  cors:
    allow-origins: "*"
    allow-headers: Content-Type,Authorization
    allow-methods: GET,POST,PUT,DELETE,OPTIONS
    allow-credentials: false
    max-age: 3h

kubernetes:
  enabled: true

  config:
    use-in-cluster: true
    kubeconfig:
      path: "" # "" means ~/.kube/config
      context: test-cluster # "" means current-context

  leader-election:
    lease-name: imageer-gateway
    lease-namespace: imageer
    lease-duration: 15s
    renew-deadline: 10s
    retry-period: 2s

database:
  use-in-memory: false
  trace-log: false
  postgres:
    host: localhost
    port: 5432
    user: user
    password: password
    database: database_name
    ssl-mode: "" # "" (disable) / disable / allow / prefer / require

valkey:
  addresses: localhost:15410
  username: admin
  password: complex_password

  pubsub:
    image-upload-done:
      channel-prefix: "imageer:local:image-upload-done:"
      max-retries: 3
    image-process-done:
      channel-prefix: "imageer:local:image-process-done:"
      max-retries: 3

kafka:
  addresses: localhost:15420
  username: admin
  password: complex_password
  consumer-group: imageer-gateway
  partitioner: "" # "" (uniform-bytes) / uniform-bytes / round-robin
  sasl-mechanism: "" # "" (plain) / plain / scram-sha-512

  topics:
    image-process-request:
      topic: imageer.image.process.request

    image-process-result:
      topic: imageer.image.process.result
      retry-topic: imageer.image.process.result.retry
      handler:
        timeout: 30s
        max-retry-attempt: 3
        retry-base-delay: 100ms

    image-s3-delete-request:
      topic: imageer.image.s3.delete.request
      retry-topic: imageer.image.s3.delete.request.retry
      handler:
        timeout: 30s
        max-retry-attempt: 3
        retry-base-delay: 100ms

auth:
  cookies:
    oidc-state:
      name: IMAGEER_OIDC_STATE
      ttl: 5m
    user:
      name: IMAGEER_USER
      ttl: 720h
      refresh-threshold: 336h

  service-account:
    api-key-header: X-API-KEY


  google:
    client-id: <your-google-client-id>
    client-secret: <your-google-client-secret>
    callback-path: /api/v1/auth/google/sign-in/callback

crypt:
  aes:
    key: <random-length-complex-string>

aws:
  s3:
    bucket: imageer
    prefix:
      image: sandbox/images
    presign:
      expiry: 10m

  cloudfront:
    images:
      distribution-domain: https://example.cloudfront.net

  sqs:
    image-upload-event-queue:
      queue-url: https://sqs.us-east-1.amazonaws.com/123456789012/queue-name
      batch-count: 10
      polling-wait-timeout: 20s
      visibility-timeout: 30s
      batch-handle-timeout: 25s
      handle-timeout: 20s

service:
  image:
    process-done-wait-timeout: 30s
    expire-check-interval: 1m
